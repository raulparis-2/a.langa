<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contenido extra</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .extra-content img { max-width: 100%; height: auto; }
  .extra-content { max-width: 68ch; }
</style>
</head>
<body>

<header id="site-header" class="site-header"></header>

<main>
  <section class="block">
    <div class="container" style="max-width: 820px;">
      <div id="extra-root"><p class="empty-state">Cargando…</p></div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/helpers.js"></script>
<script src="/assets/js/public/components.js"></script>
<script>
  // Esta página no está en el menú. Su contenido se edita desde el panel
  // de administración (Contenido extra). El enlace NO cambia nunca.
  renderHeaderFooter(null);

  (async function () {
    const root = document.getElementById("extra-root");
    try {
      const { data, error } = await window.supabaseClient
        .from("extra_page").select("eyebrow,title,content").eq("id", 1).maybeSingle();
      if (error) throw error;
      if (!data) { root.innerHTML = '<p class="empty-state">Contenido no disponible.</p>'; return; }
      document.title = data.title || "Contenido extra";
      root.innerHTML =
        (data.eyebrow ? '<p class="hero__eyebrow">' + escapeHtml(data.eyebrow) + '</p>' : "") +
        '<h1>' + escapeHtml(data.title || "") + '</h1>' +
        '<div class="post-content extra-content" id="extra-content"></div>';
      document.getElementById("extra-content").innerHTML = data.content || "";
    } catch (e) {
      root.innerHTML = '<p class="empty-state">No se pudo cargar el contenido. Inténtalo de nuevo en unos minutos.</p>';
    }
  })();
</script>
</body>
</html>
